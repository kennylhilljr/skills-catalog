# Unit tests for the catalog (SPEC CAT-1; DESIGN 4.1, 7.6).
# Runs the PR's own unit tests, which can only run as PR code. It uses no
# secrets, so it runs the same way for PRs from forks. Lint, the catalog
# manifest check, skills-ref, the scrub and the required `gate` check come
# from gate.yml, which runs main's copy over the PR's files after this
# workflow completes, so a PR that edits this file cannot weaken them. No job
# here may be named `gate`.
name: catalog

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python3 -B -m unittest discover -s tests -t .
